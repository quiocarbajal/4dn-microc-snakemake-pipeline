# =============================================================================
# Snakemake 9 Profile for Slurm HPC with Apptainer
# =============================================================================

# Executor backend for Slurm cluster
executor: slurm

# Maximum concurrent Slurm jobs to submit
jobs: 100

# Enable native Apptainer execution
use-apptainer: true
apptainer-prefix: "/hpc-prj/pezza/containers/microc_4DN_pipeline_apptainer_cache"

# Enable environment modules execution for rules requesting cluster modules
use-envmodules: true

# Apptainer execution arguments (bind shared lab filesystem and read-only reference archive)
apptainer-args: "--bind /s/pezzar-lab,/hpc-prj/pezza,/Volumes/shared-refs:/Volumes/shared-refs:ro,/archive/cbds:/archive/cbds:ro"

# General execution settings
printshellcmds: true
keep-going: false
retries: 0
rerun-incomplete: true
latency-wait: 120
max-status-checks-per-second: 0.2

# Slurm executor plugin specific settings
slurm-logdir: "logs/slurm"
slurm-keep-successful-logs: true

# Default cluster resources (no timelimits specified; uses cluster partition defaults)
default-resources:
  slurm_partition: ""
  slurm_account: ""
  tmpdir: "results/tmp"
  mem_mb: 4096
  threads: 2

# Per-rule resource specifications
# Note: Any rule omitted or missing an attribute automatically inherits from default-resources (threads: 2, mem_mb: 4096).
set-resources:
  # ---------------------------------------------------------------------------
  # A. Rules with Multi-Core Parallelism (threads != 2)
  # ---------------------------------------------------------------------------
  pairsam_parse_sort:
    threads: 16
    mem_mb: 65536
  bwa_mem:
    threads: 8
    mem_mb: 32768
  cooler_zoomify:
    threads: 8
    mem_mb: 49152
  cooler_zoomify_merged:
    threads: 8
    mem_mb: 49152
  pairsam_merge_seq_reps:
    threads: 8
    mem_mb: 16384
  cooler_cload:
    threads: 4
    mem_mb: 32768
  cooler_cload_merged:
    threads: 4
    mem_mb: 32768
  cooltools_expected:
    threads: 4
    mem_mb: 16384

  # ---------------------------------------------------------------------------
  # B. Rules with Default Cores (threads: 2 inherited) and Custom Memory
  # ---------------------------------------------------------------------------
  juicebox_pre:
    mem_mb: 65536
  juicebox_pre_merged:
    mem_mb: 65536
  pairsam_markasdup:
    mem_mb: 32768
  pairsam_filter:
    mem_mb: 32768
  merge_bio_reps:
    mem_mb: 16384
  add_hic_norm_to_mcool:
    mem_mb: 16384
  pairsqc:
    mem_mb: 16384
  cooltools_insulation:
    mem_mb: 16384
  cooltools_compartments:
    mem_mb: 16384
  pairsqc_merge:
    mem_mb: 8192

  # (Rules matching default threads: 2 and mem_mb: 4096 like fastqc_r1, fastqc_r2,
  # and addfrag_or_pass are completely covered by default-resources above)

